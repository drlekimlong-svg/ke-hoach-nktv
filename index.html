<title>Kế hoạch năm học 2026–2027 · CLB NKTV</title>

<style>
:root {
  --bg: #E3E8ED; --surface: #FFFFFF; --sunken: #EEF1F4; --field: #FFFFFF; --ink: #17231E; --muted: #55605A; --line: #C6CED6;
  --accent: #1D5C42; --on-accent: #FFFFFF; --head: #16324F;
  --warn-bg: #F6E7CF; --warn-ink: #6B4208; --danger: #9C2F2F; --danger-bg: #F7E1DF;
  --ok-bg: #DCEEE4; --ok-ink: #1D5C42; --info-bg: #DCE7F3; --info-ink: #16324F; --focus: #0B5CAD;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101B26; --surface: #1A2936; --sunken: #142230; --field: #142230; --ink: #E9EEF1; --muted: #A8B4BE; --line: #34495B;
    --accent: #62B894; --on-accent: #0B1A13; --head: #0C2135;
    --warn-bg: #3E2F14; --warn-ink: #F0D29A; --danger: #F0908A; --danger-bg: #40201E;
    --ok-bg: #1B3A2D; --ok-ink: #7FCBA9; --info-bg: #1B3147; --info-ink: #A9C4E0; --focus: #8CC2FF;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
p { margin: 0 0 8px; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

.top { background: var(--head); color: #fff; display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.top img { width: 38px; height: 38px; border-radius: 8px; flex: none; }
.top h1 { font-size: 17px; }
.top .sub { font-size: 12.5px; opacity: .8; }
.top .luu { margin-left: auto; font-size: 12.5px; opacity: .85; text-align: right; white-space: nowrap; }

.tabs { position: sticky; top: 0; z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; gap: 2px; overflow-x: auto; padding: 0 10px; }
.tabs button { border: 0; background: none; color: var(--muted); padding: 12px 14px 9px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--accent); border-color: var(--accent); font-weight: 600; }

main { max-width: 1240px; margin: 0 auto; padding: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.card > h2 { font-size: 16px; margin-bottom: 10px; }
.card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.nho { font-size: 13px; color: var(--muted); }
.grow { flex: 1; min-width: 0; }
.hang { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
label { display: block; font-size: 12.5px; color: var(--muted); }
label > input, label > select, label > textarea { margin-top: 3px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; }
textarea { resize: vertical; min-height: 38px; display: block; }
input[type=checkbox] { width: auto; }

.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 6px; padding: 8px 14px; font-weight: 600; white-space: nowrap; }
.btn.nhat { background: transparent; color: var(--accent); }
.btn.nguy { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn.nho { padding: 4px 10px; font-weight: 500; font-size: 13px; }

.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.tt-chua { background: var(--sunken); color: var(--muted); }
.tt-dang { background: var(--info-bg); color: var(--info-ink); }
.tt-cho { background: var(--warn-bg); color: var(--warn-ink); }
.tt-xong { background: var(--ok-bg); color: var(--ok-ink); }
.tt-qua { background: var(--danger-bg); color: var(--danger); }

.kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi b { display: block; font-size: 24px; line-height: 1.15; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.kpi .do b { color: var(--danger); }

.bar { height: 8px; background: var(--sunken); border-radius: 99px; overflow: hidden; min-width: 70px; }
.bar i { display: block; height: 100%; background: var(--accent); }

table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; font-size: 12.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.cuon { overflow-x: auto; }
tr.bam { cursor: pointer; }
tr.bam:hover { background: var(--sunken); }
.so { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 6px; border-radius: 8px; background: var(--head); color: #fff; font-weight: 700; font-size: 13.5px; flex: none; }

.hai-cot { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 14px; align-items: start; }
.ds { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; position: sticky; top: 56px; max-height: calc(100vh - 70px); overflow: auto; }
.ds-i { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); padding: 7px 8px; border-radius: 7px; }
.ds-i b { min-width: 22px; color: var(--muted); }
.ds-i span { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.3; }
.ds-i small { color: var(--muted); white-space: nowrap; }
.ds-i.on { background: var(--ok-bg); }
.ds-i.on b { color: var(--accent); }
.ds-i.them { color: var(--accent); font-weight: 600; }

.dv-head { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.dv-head h2 { font-size: 19px; }
.dv-head .nhom { font-size: 12.5px; color: var(--muted); }
.dk { background: var(--sunken); border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; font-size: 14px; }
.dk .chip { margin-left: 4px; }
.dv ul, .dv ol { margin: 0; padding-left: 20px; }
.chot { margin-bottom: 8px; }
.chot .cau { font-weight: 600; margin-bottom: 3px; }
.lk { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; }

.viec, .viec-dau { display: grid; grid-template-columns: minmax(0, 1.5fr) 165px 150px 132px minmax(0, .8fr) 30px; gap: 6px; align-items: start; }
.viec-dau { font-size: 12.5px; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
.viec { padding: 7px 0; border-top: 1px solid var(--line); }
.viec .v-ten { display: flex; gap: 6px; align-items: start; }
.viec .stt { min-width: 30px; padding-top: 8px; font-size: 13px; color: var(--muted); }
.viec.xong .v-ten textarea { color: var(--muted); text-decoration: line-through; }
.qua .v-han input { border-color: var(--danger); background: var(--danger-bg); }
.goiy { display: block; margin-top: 3px; border: 1px dashed var(--line); background: none; color: var(--muted); border-radius: 6px; font-size: 12px; padding: 2px 6px; width: 100%; text-align: left; }
.luuy { font-size: 12px; color: var(--muted); margin-top: 3px; }
.xoa { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; height: 36px; border-radius: 6px; }
.xoa:hover { color: var(--danger); background: var(--danger-bg); }

.nha th small { display: block; font-weight: 400; color: var(--muted); }
.nha td, .nha thead th { text-align: center; font-size: 12.5px; white-space: normal; }
.o { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); color: transparent; font-weight: 700; padding: 0; }
.o1 { border-color: var(--warn-ink); background: var(--warn-bg); color: var(--warn-ink); }
.o2 { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }

.buoc { display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px; position: sticky; top: 45px; z-index: 5; background: var(--bg); margin-bottom: 6px; }
.buoc button { flex: none; min-width: 38px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; padding: 0 8px; }
.buoc button.co { border-color: var(--accent); color: var(--accent); }
.buoc button.on { background: var(--head); border-color: var(--head); color: #fff; }
.dieu-huong { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 20px; }

details.sua, details.meta { margin-top: 12px; }
details > summary { cursor: pointer; color: var(--accent); font-weight: 600; }
details.sua > div, details.meta > div { margin-top: 10px; }

.thang { font-size: 15px; margin: 16px 0 6px; }
.lich-i { display: grid; grid-template-columns: 92px 34px minmax(0, 1fr) 170px 120px; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); align-items: center; }
.lich-i .ngay { font-variant-numeric: tabular-nums; }
.lich-i.g { color: var(--muted); }
.lich-i.q .ngay { color: var(--danger); font-weight: 600; }

.xem-truoc { background: #fff; color: #111; border: 1px solid var(--line); border-radius: 8px; padding: 22px; overflow-x: auto; }
footer { max-width: 1240px; margin: 0 auto; padding: 4px 16px 30px; font-size: 12.5px; color: var(--muted); }
#toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--head); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; max-width: 92vw; }
#toast.hien { opacity: 1; }
#inAn { display: none; }

@media (max-width: 900px) {
  main { padding: 10px; }
  .card { padding: 12px; }
  .hai-cot { grid-template-columns: 1fr; }
  .ds { position: static; display: flex; overflow-x: auto; max-height: none; gap: 4px; }
  .ds-i { width: auto; flex: none; max-width: 230px; border: 1px solid var(--line); }
  .viec-dau { display: none; }
  .viec { grid-template-columns: 1fr 1fr; }
  .viec .v-ten { grid-column: 1 / -1; }
  .viec .xoa { grid-column: 1 / -1; justify-self: end; height: 28px; }
  .lich-i { grid-template-columns: 84px 30px minmax(0, 1fr); }
  .lich-i .nguoi, .lich-i .tt { grid-column: 3; }
  .top .luu { display: none; }
  .buoc { top: 44px; }
}
@media print {
  body > *:not(#inAn) { display: none !important; }
  #inAn { display: block; }
  body { background: #fff; }
}
</style>

    canChot: (d.canChot || []).map(c => ({ cau: c, qd: '' })),

  };
}
function taoHop(o) {
  return Object.assign({ id: uid('H'), ten: 'Họp CLB', ngay: today(), gioBD: '', gioKT: '', diaDiem: '', chuTri: '', thuKy: '', thanhPhan: '', vang: '', ghi: {}, ketLuan: '' }, o || {});
}
function fresh() {

}
function chuan(s) {
  s.nhanSu = s.nhanSu || []; s.cuocHop = s.cuocHop || [];
  s.dauViec.forEach(d => {
    d.viec = d.viec || []; d.canChot = d.canChot || []; d.sanPham = d.sanPham || []; d.theoNha = d.theoNha || []; d.nha = d.nha || {};
    d.phuThuoc = d.phuThuoc || []; d.lienQuan = d.lienQuan || []; d.trangThai = d.trangThai || 'chua';
    ['phuTrach', 'han', 'ghiChu', 'ten', 'mucTieu', 'dieuKien', 'boiCanh', 'thayThe', 'nhom'].forEach(k => { if (d[k] == null) d[k] = ''; });
    d.viec.forEach(v => { v.trangThai = v.trangThai || 'chua'; ['ten', 'phuTrach', 'han', 'ghiChu', 'goiY', 'luuY'].forEach(k => { if (v[k] == null) v[k] = ''; }); });
  });
  s.cuocHop.forEach(h => { h.ghi = h.ghi || {}; });
  if (!s.cuocHop.length) s.cuocHop.push(taoHop(SEED.hopMacDinh));
  return s;
}
function load() {

    if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.dauViec)) return chuan(s); }
  } catch (e) { /* dùng khung gốc */ }
  return fresh();
}

const byId = id => S.dauViec.find(d => d.id === id);
const tienDo = d => { const n = d.viec.length, x = d.viec.filter(v => v.trangThai === 'xong').length; return { n, x, pct: n ? Math.round(x * 100 / n) : 0 }; };
const quaHan = o => !!o.han && o.trangThai !== 'xong' && o.han < today();
const sapHan = o => { if (!o.han || o.trangThai === 'xong') return false; const t = today(); return o.han >= t && o.han <= congNgay(t, 14); };
const khoa = d => d.phuThuoc.filter(id => { const p = byId(id); return p && p.trangThai !== 'xong'; });
const tachTen = s => String(s || '').split(/[,;\/\n]|\s+và\s+/i).map(x => x.trim()).filter(Boolean);
function tenTrongPhanCong() {
  const m = new Map();
  const them = s => tachTen(s).forEach(x => m.set(x.toLowerCase(), x));
  S.dauViec.forEach(d => { them(d.phuTrach); d.viec.forEach(v => them(v.phuTrach)); });
  return m;
}
function demViec(ten) {
  const k = ten.trim().toLowerCase(); if (!k) return 0; let n = 0;
  const co = s => tachTen(s).some(x => x.toLowerCase() === k);
  S.dauViec.forEach(d => { if (co(d.phuTrach)) n++; d.viec.forEach(v => { if (co(v.phuTrach)) n++; }); });
  return n;
}

function vPhanCong() {

    '</div><div class="hang" style="margin-top:10px"><span class="nho grow">' + kq.length + ' việc</span><button class="btn nhat nho" data-act="xCsv">Xuất bảng phân công (.csv, mở bằng Excel)</button></div></div>' +
    '<div class="card"><div class="cuon"><table style="min-width:860px"><thead><tr><th>#</th><th>Việc cụ thể</th><th style="width:170px">Phụ trách</th><th style="width:150px">Hạn</th><th style="width:135px">Trạng thái</th><th style="width:190px">Ghi chú</th></tr></thead><tbody>' +
    (kq.length ? kq.map(x => '<tr class="viec-tr" data-dv="' + x.d.id + '" data-viec="' + esc(x.v.id) + '"><td style="white-space:nowrap"><button class="lk" data-act="moDV" data-id="' + x.d.id + '">' + x.d.so + '.' + (x.i + 1) + '</button></td><td>' + esc(x.v.ten) + '<div class="nho">' + esc(x.d.ten) + '</div></td><td>' + oNguoi(x.v.phuTrach, 'data-vf="phuTrach"') + '</td><td class="v-han"><input type="date" data-vf="han" value="' + esc(x.v.han) + '" aria-label="Hạn">' +
      (x.v.goiY ? '<button class="goiy" data-act="dungGoiY"' + (x.v.han ? ' hidden' : '') + '>gợi ý ' + dmy(x.v.goiY) + '</button>' : '') + '</td><td>' + oTT(x.v.trangThai, 'data-vf="trangThai"') + '</td><td><input data-vf="ghiChu" value="' + esc(x.v.ghiChu) + '" aria-label="Ghi chú"></td></tr>').join('') : '<tr><td colspan="6" class="nho">Không có việc nào khớp bộ lọc.</td></tr>') +

}

function vLich() {
  const it = []; let trong = 0;
  S.dauViec.forEach(d => {
    if (d.han) it.push({ ngay: d.han, d, ten: 'Hạn hoàn thành đầu việc: ' + d.ten, nguoi: d.phuTrach, o: d });
    d.viec.forEach(v => {
      if (v.han) it.push({ ngay: v.han, d, ten: v.ten, nguoi: v.phuTrach, o: v });
      else if (ui.lichGoiY && v.goiY) it.push({ ngay: v.goiY, d, ten: v.ten, nguoi: v.phuTrach, o: v, g: true });
      else trong++;
    });
  });
  it.sort((a, b) => a.ngay < b.ngay ? -1 : a.ngay > b.ngay ? 1 : a.d.so - b.d.so);
  let out = '<div class="card"><label style="font-size:15px;color:var(--ink)"><input type="checkbox" data-act="lichGoiY"' + (ui.lichGoiY ? ' checked' : '') + '> Hiện cả hạn gợi ý của những việc chưa chốt hạn (chữ nhạt, ghi “gợi ý”)</label><p class="nho" style="margin:8px 0 0">' + trong + ' việc chưa có hạn' + (ui.lichGoiY ? ' và chưa có hạn gợi ý' : '') + '.</p></div>';
  if (!it.length) return out + '<div class="card"><p class="nho">Chưa có hạn nào được chốt.</p></div>';
  let thang = '';
  out += '<div class="card">';
  it.forEach(x => {
    const m = x.ngay.slice(0, 7);
    if (m !== thang) { thang = m; out += '<h2 class="thang">Tháng ' + m.slice(5) + '/' + m.slice(0, 4) + '</h2>'; }
    out += '<div class="lich-i' + (x.g ? ' g' : '') + (!x.g && quaHan(x.o) ? ' q' : '') + '"><span class="ngay">' + thu(x.ngay) + ' ' + x.ngay.slice(8) + '/' + x.ngay.slice(5, 7) + '</span><button class="lk" data-act="moDV" data-id="' + x.d.id + '"><span class="so">' + x.d.so + '</span></button><span>' + esc(x.ten) + '</span><span class="nguoi nho">' + (esc(x.nguoi) || 'chưa phân công') + '</span><span class="tt">' + (x.g ? '<span class="chip tt-chua">gợi ý</span>' : chipTT(x.o)) + '</span></div>';
  });
  return out + '</div>';
}

      S.nhanSu.map(p => '<tr data-ns="' + p.id + '"><td><input data-nf="ten" value="' + esc(p.ten) + '" aria-label="Họ tên"></td><td>' + oVT(p.vaiTro, 'data-nf="vaiTro" aria-label="Vai trò"') + '</td><td>' + oNha(p.nha, 'data-nf="nha" aria-label="Nhà"') + '</td><td>' + demViec(p.ten) + '</td><td><button class="xoa" data-act="nsXoa" aria-label="Xóa người này">×</button></td></tr>').join('') + '</tbody></table></div>'
      : '<p class="nho">Chưa có ai. Danh sách này dùng để gợi ý tên khi gõ ô “Người phụ trách”; vẫn gõ tự do được.</p>') + '</div>';
}

const VIEW = { tongquan: vTongQuan, hop: vHop, dauviec: vDauViec, phancong: vPhanCong, lich: vLich, nhansu: vNhanSu, luutru: vLuuTru };
function capNhatDsNguoi() {
  const m = new Map();
  S.nhanSu.forEach(p => { const t = p.ten.trim(); if (t) m.set(t.toLowerCase(), t); });
  tenTrongPhanCong().forEach((v, k) => { if (!m.has(k)) m.set(k, v); });
  ['BCN', '6 nhà'].concat(SEED.nha.map(n => 'Nhà ' + n.ten)).forEach(x => { if (!m.has(x.toLowerCase())) m.set(x.toLowerCase(), x); });
  $('#dsNguoi').innerHTML = Array.from(m.values()).map(x => '<option value="' + esc(x) + '">').join('');
}
function render() {
  $('#tabs').innerHTML = TABS.map(t => '<button data-tab="' + t[0] + '" class="' + (t[0] === ui.tab ? 'on' : '') + '">' + t[1] + '</button>').join('');

/* ---------- Biên bản và tệp xuất ---------- */
const CSS_BB = '.bb{font-family:"Times New Roman",Times,serif;font-size:13pt;line-height:1.4;color:#000}.bb h1{font-size:16pt;text-align:center;margin:6pt 0 12pt}.bb h2{font-size:13.5pt;margin:16pt 0 6pt}.bb h3{font-size:13pt;margin:14pt 0 4pt;text-transform:none;letter-spacing:0;color:#000}.bb p{margin:0 0 5pt}.bb .dv-ten{text-align:center;font-weight:bold;margin:0}.bb table{border-collapse:collapse;width:100%;margin:6pt 0 8pt}.bb th,.bb td{border:1px solid #444;padding:3pt 5pt;vertical-align:top;text-align:left;font-size:12pt;color:#000;white-space:normal}.bb table.meta th{width:26%;background:#f0f0f0}.bb table.pc th{background:#e6e6e6}.bb table.ky td{border:0;text-align:center;font-weight:bold;width:50%;padding-top:14pt}.bb .chan{font-size:10pt;color:#555;margin-top:18pt}.bb .mo{color:#555;font-style:italic}';
function thoiGianHop(h) { return (h.ngay ? THU_DAY[new Date(h.ngay + 'T00:00:00').getDay()] + ', ngày ' + dmy(h.ngay) : '') + (h.gioBD ? ', từ ' + h.gioBD : '') + (h.gioKT ? ' đến ' + h.gioKT : ''); }
function viecConNgo() { const r = []; S.dauViec.forEach(d => d.viec.forEach((v, i) => { const t = []; if (!v.phuTrach.trim()) t.push('người phụ trách'); if (!v.han) t.push('hạn'); if (t.length) r.push({ ma: d.so + '.' + (i + 1), ten: v.ten, thieu: t.join(', ') }); })); return r; }
function tongViec() { return S.dauViec.reduce((a, d) => a + d.viec.length, 0); }

function htmlBienBan(h) {
  const e = esc, nl = s => e(s).replace(/\n/g, '<br>'), mo = t => '<span class="mo">' + t + '</span>';
  let o = '<div class="bb"><p class="dv-ten">' + e(SEED.donVi.toUpperCase()) + '</p><h1>BIÊN BẢN<br>' + e(h.ten || 'Cuộc họp') + '</h1>';
  o += '<table class="meta"><tr><th>Thời gian</th><td>' + (e(thoiGianHop(h)) || mo('chưa ghi')) + '</td></tr><tr><th>Địa điểm</th><td>' + (e(h.diaDiem) || mo('chưa ghi')) + '</td></tr><tr><th>Chủ trì</th><td>' + (e(h.chuTri) || mo('chưa ghi')) + '</td></tr><tr><th>Thư ký</th><td>' + (e(h.thuKy) || mo('chưa ghi')) + '</td></tr><tr><th>Thành phần tham dự</th><td>' + (nl(h.thanhPhan) || mo('chưa ghi')) + '</td></tr>' + (h.vang.trim() ? '<tr><th>Vắng</th><td>' + nl(h.vang) + '</td></tr>' : '') + '</table>';
  o += '<h2>I. Nội dung và phân công theo đầu việc</h2>';
  S.dauViec.forEach(d => {
    o += '<h3>' + d.so + '. ' + e(d.ten) + '</h3>';
    o += '<p><b>Phụ trách chính:</b> ' + (e(d.phuTrach) || mo('chưa phân công')) + ' · <b>Hạn hoàn thành:</b> ' + (dmy(d.han) || mo('chưa chốt')) + ' · <b>Trạng thái:</b> ' + TT[d.trangThai] + '</p>';
    if (d.dieuKien) o += '<p><b>Điều kiện khởi động:</b> ' + e(d.dieuKien) + (d.thayThe ? ' ' + e(d.thayThe) : '') + '</p>';
    const g = (h.ghi[d.id] || '').trim(); if (g) o += '<p><b>Ghi chú cuộc họp:</b> ' + nl(g) + '</p>';
    if (d.ghiChu.trim()) o += '<p><b>Ghi chú chung:</b> ' + nl(d.ghiChu.trim()) + '</p>';
    const qd = d.canChot.filter(c => c.qd.trim());
    if (qd.length) o += '<p><b>Các điểm đã chốt:</b></p><table class="pc"><tr><th style="width:45%">Câu hỏi</th><th>Quyết định</th></tr>' + qd.map(c => '<tr><td>' + e(c.cau) + '</td><td>' + nl(c.qd.trim()) + '</td></tr>').join('') + '</table>';
    const chua = d.canChot.filter(c => !c.qd.trim());
    if (chua.length) o += '<p><b>Chưa chốt:</b> ' + chua.map(c => e(c.cau)).join(' · ') + '</p>';
    if (d.viec.length) o += '<table class="pc"><tr><th style="width:6%">#</th><th>Việc cụ thể</th><th style="width:19%">Phụ trách</th><th style="width:13%">Hạn</th><th style="width:13%">Trạng thái</th><th style="width:17%">Ghi chú</th></tr>' + d.viec.map((v, i) => '<tr><td>' + d.so + '.' + (i + 1) + '</td><td>' + e(v.ten) + '</td><td>' + e(v.phuTrach) + '</td><td>' + dmy(v.han) + '</td><td>' + TT[v.trangThai] + '</td><td>' + e(v.ghiChu) + '</td></tr>').join('') + '</table>';
    const coNha = d.theoNha.length && SEED.nha.some(n => (d.nha[n.id] || []).some(x => x));
    if (coNha) o += '<table class="pc"><tr><th>Theo từng nhà</th>' + d.theoNha.map(l => '<th>' + e(l) + '</th>').join('') + '</tr>' + SEED.nha.map(n => '<tr><td>' + e(n.ten) + '</td>' + d.theoNha.map((l, i) => '<td>' + ['', 'đang làm', 'xong'][(d.nha[n.id] || [])[i] || 0] + '</td>').join('') + '</tr>').join('') + '</table>';
  });
  o += '<h2>II. Kết luận chung</h2><p>' + (nl(h.ketLuan.trim()) || mo('chưa ghi')) + '</p>';
  const ngo = viecConNgo();
  o += '<h2>III. Việc còn để ngỏ</h2>';
  if (!ngo.length) o += '<p>Tất cả việc cụ thể đã có người phụ trách và hạn.</p>';
  else if (ngo.length > 40) o += '<p>Còn ' + ngo.length + '/' + tongViec() + ' việc cụ thể chưa đủ người phụ trách hoặc hạn; xem các ô trống trong bảng ở mục I.</p>';
  else o += '<table class="pc"><tr><th style="width:8%">#</th><th>Việc</th><th style="width:28%">Còn thiếu</th></tr>' + ngo.map(x => '<tr><td>' + x.ma + '</td><td>' + e(x.ten) + '</td><td>' + x.thieu + '</td></tr>').join('') + '</table>';
  o += '<table class="ky"><tr><td>THƯ KÝ<br><br><br><br>' + e(h.thuKy) + '</td><td>CHỦ TRÌ<br><br><br><br>' + e(h.chuTri) + '</td></tr></table>';
  o += '<p class="chan">Xuất từ app Kế hoạch năm học ' + e(SEED.namHoc) + ' của ' + e(SEED.donVi) + ' lúc ' + new Date().toLocaleString('vi-VN') + '. Khung kế hoạch bản ' + e(SEED.phienBan) + '.</p></div>';
  return o;
}
function tepHtml(h, word) {
  return '<!doctype html><html lang="vi"' + (word ? ' xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"' : '') + '><head><meta charset="utf-8"><title>Biên bản ' + esc(h.ten) + ' ' + dmy(h.ngay) + '</title><style>' + (word ? '@page{size:21cm 29.7cm;margin:2cm 2cm 2cm 3cm}' : 'body{max-width:800px;margin:24px auto;padding:0 16px}') + CSS_BB + '</style></head><body>' + htmlBienBan(h) + '</body></html>';
}
function mdBienBan(h) {
  const c = s => String(s || '').replace(/\|/g, '\\|').replace(/\n/g, '<br>'), L = [];
  L.push('# BIÊN BẢN: ' + (h.ten || 'Cuộc họp'), '', '**' + SEED.donVi + '** · Năm học ' + SEED.namHoc, '', '| | |', '|---|---|');
  L.push('| Thời gian | ' + c(thoiGianHop(h)) + ' |', '| Địa điểm | ' + c(h.diaDiem) + ' |', '| Chủ trì | ' + c(h.chuTri) + ' |', '| Thư ký | ' + c(h.thuKy) + ' |', '| Thành phần tham dự | ' + c(h.thanhPhan) + ' |');
  if (h.vang.trim()) L.push('| Vắng | ' + c(h.vang) + ' |');
  L.push('', '## I. Nội dung và phân công theo đầu việc', '');
  S.dauViec.forEach(d => {
    L.push('### ' + d.so + '. ' + d.ten, '');
    L.push('- **Phụ trách chính:** ' + (d.phuTrach || 'chưa phân công'), '- **Hạn hoàn thành:** ' + (dmy(d.han) || 'chưa chốt'), '- **Trạng thái:** ' + TT[d.trangThai]);
    if (d.dieuKien) L.push('- **Điều kiện khởi động:** ' + d.dieuKien + (d.thayThe ? ' ' + d.thayThe : ''));
    const g = (h.ghi[d.id] || '').trim(); if (g) L.push('- **Ghi chú cuộc họp:** ' + g.replace(/\n/g, '<br>'));
    if (d.ghiChu.trim()) L.push('- **Ghi chú chung:** ' + d.ghiChu.trim().replace(/\n/g, '<br>'));
    d.canChot.forEach(x => L.push('- ' + (x.qd.trim() ? '**Đã chốt.** ' + x.cau + ' → ' + x.qd.trim().replace(/\n/g, '<br>') : '**Chưa chốt.** ' + x.cau)));
    if (d.viec.length) {
      L.push('', '| # | Việc cụ thể | Phụ trách | Hạn | Trạng thái | Ghi chú |', '|---|---|---|---|---|---|');
      d.viec.forEach((v, i) => L.push('| ' + d.so + '.' + (i + 1) + ' | ' + c(v.ten) + ' | ' + c(v.phuTrach) + ' | ' + dmy(v.han) + ' | ' + TT[v.trangThai] + ' | ' + c(v.ghiChu) + ' |'));
    }
    const coNha = d.theoNha.length && SEED.nha.some(n => (d.nha[n.id] || []).some(x => x));
    if (coNha) {
      L.push('', '| Theo từng nhà | ' + d.theoNha.map(c).join(' | ') + ' |', '|---|' + d.theoNha.map(() => '---|').join(''));
      SEED.nha.forEach(n => L.push('| ' + n.ten + ' | ' + d.theoNha.map((l, i) => ['', 'đang làm', 'xong'][(d.nha[n.id] || [])[i] || 0]).join(' | ') + ' |'));
    }
    L.push('');
  });
  L.push('## II. Kết luận chung', '', h.ketLuan.trim() || '(chưa ghi)', '');
  const ngo = viecConNgo();
  L.push('## III. Việc còn để ngỏ', '');
  if (!ngo.length) L.push('Tất cả việc cụ thể đã có người phụ trách và hạn.');
  else { L.push('Còn ' + ngo.length + '/' + tongViec() + ' việc cụ thể chưa đủ người phụ trách hoặc hạn.', ''); if (ngo.length <= 40) ngo.forEach(x => L.push('- ' + x.ma + ' ' + x.ten + ' — thiếu: ' + x.thieu)); }
  L.push('', '---', '', 'Thư ký: ' + (h.thuKy || '') + ' · Chủ trì: ' + (h.chuTri || ''), '', 'Xuất từ app Kế hoạch năm học ' + SEED.namHoc + ' lúc ' + new Date().toLocaleString('vi-VN') + '. Khung kế hoạch bản ' + SEED.phienBan + '.', '');
  return L.join('\n');
}
function csvPhanCong() {
  const sep = (1.1).toLocaleString().indexOf(',') >= 0 ? ';' : ',';
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const R = [['Số đầu việc', 'Đầu việc', 'Phụ trách chính', 'Hạn đầu việc', 'Mã việc', 'Việc cụ thể', 'Phụ trách', 'Hạn', 'Hạn gợi ý', 'Trạng thái', 'Ghi chú']];
  S.dauViec.forEach(d => d.viec.forEach((v, i) => R.push([d.so, d.ten, d.phuTrach, dmy(d.han), d.so + '.' + (i + 1), v.ten, v.phuTrach, dmy(v.han), dmy(v.goiY), TT[v.trangThai], v.ghiChu])));
  return '﻿' + R.map(r => r.map(q).join(sep)).join('\r\n') + '\r\n';
}
async function luuTep(ten, noiDung, mime) {
  const blob = new Blob([noiDung], { type: mime + ';charset=utf-8' });
  if (window.showSaveFilePicker) {
    try {
      const duoi = ten.slice(ten.lastIndexOf('.'));
      const hd = await window.showSaveFilePicker({ suggestedName: ten, types: [{ description: 'Tệp lưu trữ', accept: { [mime]: [duoi] } }] });
      const w = await hd.createWritable(); await w.write(blob); await w.close();
      toast('Đã lưu ' + hd.name); return;
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = ten; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Đã tải ' + ten + ' về thư mục Tải xuống');
}
const tenTep = (dau, h, duoi) => dau + '_' + (h && h.ngay ? h.ngay : today()) + duoi;
function nhapJson(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const s = JSON.parse(String(r.result).replace(/^﻿/, ''));
      if (!s || !Array.isArray(s.dauViec)) throw new Error('sai');
      if (!confirm('Thay toàn bộ dữ liệu đang có trên máy này bằng tệp sao lưu (cập nhật ' + (s.capNhat ? new Date(s.capNhat).toLocaleString('vi-VN') : 'không rõ') + ')?')) return;
      S = chuan(s); ui.hop = ''; ui.dv = ''; ui.buoc = 0; S.capNhat = S.capNhat || new Date().toISOString(); ghi(); render(); toast('Đã khôi phục dữ liệu');
    } catch (e) { alert('Tệp này không phải tệp sao lưu của app.'); }
  };
  r.readAsText(file);
}

/* ---------- Xử lý thao tác ---------- */
function ctx(el) {
  const de = el.closest('[data-dv]'), ve = el.closest('[data-viec]');
  const d = de ? byId(de.dataset.dv) : null;
  return { de, ve, d, v: d && ve ? d.viec.find(x => x.id === ve.dataset.viec) : null };
}
function lamTuoi(de, d) {
  if (!de || !d) return;
  const p = tienDo(d);
  $$('[data-bind=tiendo]', de).forEach(e => { e.textContent = '· ' + p.x + '/' + p.n + ' việc xong'; });
  $$('[data-bind=chip]', de).forEach(e => { e.innerHTML = chipTT(d); });
  (de.matches('[data-viec]') ? [de] : $$('[data-viec]', de)).forEach(r => {
    const v = d.viec.find(x => x.id === r.dataset.viec); if (!v) return;
    r.classList.toggle('xong', v.trangThai === 'xong'); r.classList.toggle('qua', quaHan(v));
    const g = $('.goiy', r); if (g) g.hidden = !!v.han;
  });
}
function apDung(t, laChange) {
  const ds = t.dataset, val = t.value;
  if (ds.vf) { const c = ctx(t); if (!c.v) return; c.v[ds.vf] = val; save(); lamTuoi(c.de, c.d); return; }
  if (ds.f) { const c = ctx(t); if (!c.d) return; c.d[ds.f] = val; save(); lamTuoi(c.de, c.d); return; }
  if ('qd' in ds) { const c = ctx(t); if (!c.d || !c.d.canChot[+ds.qd]) return; c.d.canChot[+ds.qd].qd = val; save(); return; }
  if (ds.hf) { hopHienTai()[ds.hf] = val; save(); return; }
  if (ds.hopghi) { hopHienTai().ghi[ds.hopghi] = val; save(); return; }
  if (ds.nf) { const r = t.closest('[data-ns]'), p = r && S.nhanSu.find(x => x.id === r.dataset.ns); if (!p) return; p[ds.nf] = val; save(); if (laChange) capNhatDsNguoi(); return; }
  if (!laChange) return;
  if (ds.kf) {
    const c = ctx(t); if (!c.d) return; const d = c.d;
    if (ds.kf === 'sanPham' || ds.kf === 'theoNha') d[ds.kf] = dong(val);
    else if (ds.kf === 'canChot') d.canChot = dong(val).map((cau, i) => ({ cau, qd: (d.canChot[i] || {}).qd || '' }));
    else d[ds.kf] = val.trim();
    save(); render(); return;
  }
  if (ds.loc) { ui.loc[ds.loc] = val; render(); return; }
  if (ds.chon === 'hop') { ui.hop = val; ui.buoc = 0; render(); return; }
}
const view = $('#view');
view.addEventListener('input', e => { const t = e.target; if (t.tagName === 'TEXTAREA') grow(t); apDung(t, false); });
view.addEventListener('change', e => apDung(e.target, true));
view.addEventListener('toggle', e => { const t = e.target, k = t.dataset && t.dataset.mo; if (k) ui[k] = t.open; if (t.open) $$('textarea', t).forEach(grow); }, true);
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) den(b.dataset.tab); });
$('#tepNhap').addEventListener('change', e => { const f = e.target.files[0]; if (f) nhapJson(f); e.target.value = ''; });

view.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (e.target.closest('input, select, textarea') && b.tagName === 'TR') return;
  const act = b.dataset.act, c = ctx(b), h = hopHienTai();
  switch (act) {
    case 'moDV': if (e.target.closest('button') && e.target.closest('button') !== b && b.tagName === 'TR') return; ui.dv = b.dataset.id; den('dauviec'); window.scrollTo(0, 0); break;
    case 'chonDV': ui.dv = b.dataset.id; render(); break;
    case 'themViec': {
      if (!c.d) break; const v = { id: uid(c.d.id), ten: '', goiY: '', luuY: '', phuTrach: '', han: '', trangThai: 'chua', ghiChu: '' };
      c.d.viec.push(v); save(); render();
      const el = $('[data-viec="' + v.id + '"] textarea'); if (el) el.focus(); break;
    }
    case 'xoaViec': if (!c.v) break; if ((c.v.ten || c.v.phuTrach || c.v.han) && !confirm('Xóa việc “' + (c.v.ten || 'chưa đặt tên') + '”?')) break; c.d.viec = c.d.viec.filter(x => x !== c.v); save(); render(); break;
    case 'dungGoiY': if (!c.v || !c.v.goiY) break; c.v.han = c.v.goiY; { const i = $('[data-vf=han]', c.ve); if (i) i.value = c.v.han; } save(); lamTuoi(c.de, c.d); break;
    case 'goiYTatCa': if (!c.d) break; c.d.viec.forEach(v => { if (v.goiY && !v.han) v.han = v.goiY; }); save(); render(); toast('Đã điền hạn gợi ý cho các việc còn trống của đầu việc ' + c.d.so); break;
    case 'nha': {
      if (!c.d) break; const a = c.d.nha[b.dataset.nha] = c.d.nha[b.dataset.nha] || [], i = +b.dataset.i, val = ((a[i] || 0) + 1) % 3;
      a[i] = val; b.className = 'o o' + val; b.textContent = ['', '…', '✓'][val]; save(); break;
    }
    case 'dvMoi': {
      const ten = prompt('Tên đầu việc mới:'); if (!ten || !ten.trim()) break;
      const so = S.dauViec.reduce((m, d) => Math.max(m, d.so), 0) + 1;
      const d = taoDV({ id: uid('DV'), so, ten: ten.trim(), nhom: 'Bổ sung' }); S.dauViec.push(d); ui.dv = d.id; ui.suaMo = true; save(); den('dauviec'); break;
    }
    case 'dvXoa': if (!c.d) break; if (!confirm('Xóa đầu việc ' + c.d.so + ' “' + c.d.ten + '” cùng ' + c.d.viec.length + ' việc cụ thể? Không hoàn tác được; nên sao lưu trước.')) break; S.dauViec = S.dauViec.filter(x => x !== c.d); ui.dv = ''; ui.buoc = 0; save(); render(); break;
    case 'buoc': ui.buoc = +b.dataset.i; render(); cuonBuoc(); break;
    case 'truoc': if (ui.buoc > 0) { ui.buoc--; render(); cuonBuoc(); } break;
    case 'sau': if (ui.buoc < S.dauViec.length) { ui.buoc++; render(); cuonBuoc(); } break;
    case 'hopMoi': { const m = taoHop({ ten: 'Họp CLB' }); S.cuocHop.push(m); ui.hop = m.id; ui.buoc = 0; ui.metaMo = true; save(); render(); break; }
    case 'hopXoa': if (S.cuocHop.length < 2) { toast('Phải giữ ít nhất một cuộc họp'); break; } if (!confirm('Xóa cuộc họp “' + h.ten + '” ngày ' + dmy(h.ngay) + ' cùng ghi chú của cuộc họp? Phân công và hạn không bị xóa.')) break; S.cuocHop = S.cuocHop.filter(x => x !== h); ui.hop = ''; save(); render(); break;
    case 'lichGoiY': ui.lichGoiY = !ui.lichGoiY; render(); break;
    case 'nsThem': case 'nsThemNhieu': {
      const ds = act === 'nsThem' ? [$('#nsTen').value.trim()] : dong($('#nsNhieu').value);
      const vt = $('#nsVaiTro').value, nha = $('#nsNha').value; let n = 0;
      ds.filter(Boolean).forEach(ten => { if (!S.nhanSu.some(p => p.ten.trim().toLowerCase() === ten.toLowerCase())) { S.nhanSu.push({ id: uid('P'), ten, vaiTro: vt, nha }); n++; } });
      if (n) { save(); render(); toast('Đã thêm ' + n + ' người'); } else toast('Không có tên mới để thêm'); break;
    }
    case 'nsThemTen': S.nhanSu.push({ id: uid('P'), ten: b.dataset.ten, vaiTro: 'Thành viên', nha: '' }); save(); render(); break;
    case 'nsXoa': { const r = b.closest('[data-ns]'); S.nhanSu = S.nhanSu.filter(p => p.id !== r.dataset.ns); save(); render(); break; }
    case 'xDoc': luuTep(tenTep('BIEN_BAN_HOP', h, '.doc'), '﻿' + tepHtml(h, true), 'application/msword'); break;
    case 'xHtml': luuTep(tenTep('BIEN_BAN_HOP', h, '.html'), tepHtml(h, false), 'text/html'); break;
    case 'xMd': luuTep(tenTep('BIEN_BAN_HOP', h, '.md'), mdBienBan(h), 'text/markdown'); break;
    case 'xIn': $('#inAn').innerHTML = '<style>' + CSS_BB + '</style>' + htmlBienBan(h); window.print(); break;
    case 'xCsv': luuTep(tenTep('PHAN_CONG', null, '.csv'), csvPhanCong(), 'text/csv'); break;
    case 'xJson': { const d = new Date(); luuTep('SAO_LUU_KE_HOACH_' + today() + '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.json', JSON.stringify(S, null, 1), 'application/json'); break; }
    case 'nhapJson': $('#tepNhap').click(); break;
    case 'datLai': if (!confirm('Xóa toàn bộ phân công, hạn, ghi chú, nhân sự và các cuộc họp trên máy này, quay về khung kế hoạch gốc? Nên sao lưu trước.')) break; S = fresh(); ui.hop = ''; ui.dv = ''; ui.buoc = 0; S.capNhat = new Date().toISOString(); ghi(); render(); toast('Đã đặt lại về khung gốc'); break;
    case 'xemTruoc': ui.xem = !ui.xem; render(); break;
  }
});
function cuonBuoc() {
  const s = $('#buoc'); if (!s) return;
  const y = s.getBoundingClientRect().top + window.scrollY - 50; if (window.scrollY > y) window.scrollTo(0, y);
  const on = $('button.on', s); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}

/* ---------- Khởi động ---------- */
$('#phienBan').textContent = 'Khung kế hoạch bản ' + SEED.phienBan + ', lập ngày ' + dmy(SEED.ngayLap);
(function () { const t = location.hash.slice(1); if (VIEW[t]) ui.tab = t; })();
if (S.capNhat) $('#luu').textContent = 'Dữ liệu trên máy này, cập nhật ' + new Date(S.capNhat).toLocaleString('vi-VN');
render();
</script>
